[project]
name = "stonks2-backend"
version = "0.1.0"
description = "FastAPI backend for Stonks v2 stock analysis application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "yfinance>=0.2.37",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.1",
    "vaderSentiment>=3.3.2",
    "pydantic>=2.6.0",
    "cachetools>=5.3.3",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
